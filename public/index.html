<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telugu Trader Mindset - Professional Trading Journal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Rajdhani', monospace;
            background: #03080c;
            color: #e4e6eb;
            overflow: hidden;
        }

        #root {
            width: 100%;
            height: 100%;
        }

        /* Loading screen */
        .loading-screen {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #03080c;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        .loading-content {
            text-align: center;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid #1a2332;
            border-top-color: #e8a020;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #e8a020;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-screen">
            <div class="loading-content">
                <div class="loading-spinner"></div>
                <div class="loading-text">TRADING JOURNAL PRO</div>
                <p style="color: #9ca3af; margin-top: 10px; font-size: 12px;">Loading...</p>
            </div>
        </div>
    </div>
</body>
</html>
